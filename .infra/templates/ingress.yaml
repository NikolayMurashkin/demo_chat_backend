{{- $host := required "ingress.host обязателен" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  # DNS берёт wildcard *.dev.sodrujestvo.org, сертификат выпускает cert-manager — руками
  # не заводится ни то, ни другое.
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ printf "%s-tls" .Release.Name | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
