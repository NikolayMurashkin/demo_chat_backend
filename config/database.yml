# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
# Production — Postgres по DATABASE_URL (Render free Postgres: durable, переживает сон/редеплой).
# Локальная разработка остаётся на SQLite (development/test выше).
production:
  adapter: postgresql
  encoding: unicode
  # Пул делят три независимых потребителя, а не одни только веб-потоки: HTTP-треды Puma,
  # воркеры ActionCable (каждый connect/subscribe/receive лезет в БД) и треды ActiveJob.
  # Привязка пула к одному RAILS_MAX_THREADS занижала его — треды ждали коннект по 5 секунд
  # и запрос выглядел как зависшая загрузка.
  pool: <%= ENV.fetch("DB_POOL") { Integer(ENV.fetch("RAILS_MAX_THREADS", 5)) + Integer(ENV.fetch("CABLE_WORKER_POOL_SIZE", 4)) + 5 } %>
  # Ждать коннект дольше пары секунд смысла нет: лучше быстрая ошибка, чем висящий сокет.
  checkout_timeout: <%= ENV.fetch("DB_CHECKOUT_TIMEOUT", 3) %>
  url: <%= ENV["DATABASE_URL"] %>
