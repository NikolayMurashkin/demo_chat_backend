# Сборка и деплой чат-бэка в кластер teachbase-bpsb.
#
# Сервис отдельный и самодостаточный: у него свой namespace, своя БД и свой хост, поэтому
# пайплайн не завязан ни на develop основного фронта, ни на чей-либо релизный цикл. Деплой
# ручной — «задеплоил и забыл», без автоматики на каждый пуш.
#
# Все переменные (YC_KEY, YC_CLOUD_ID, YC_FOLDER_ID, YC_REGISTRY) наследуются от группы,
# заводить в проекте ничего не нужно. Исключение — RAILS_MASTER_KEY: он лежит только на
# машине разработчика (config/master.key в .gitignore) и добавляется в переменные проекта
# как masked.

# Раннеры у группы разные, и джобы к ним не взаимозаменяемы. Тег gitlab-runner-bpsb-vm ведёт
# на shell-executor: он выполняет команды прямо на хосте и `image:` игнорирует — зато на этом
# хосте есть docker, поэтому сборка идёт туда. Джобам деплоя нужен docker-executor, чтобы
# подняться внутри образа с yc/kubectl/helm, — им теги не ставим вовсе.
.docker_job: &docker_job
  image: docker:latest
  tags:
    - gitlab-runner-bpsb-vm

variables:
  IMAGE: ${YC_REGISTRY}/chat-demo-api
  KUBE_CLUSTER: teachbase-bpsb
  NAMESPACE: chat-demo
  HELM_RELEASE: chat-demo-api
  CHAT_HOST: chat-demo-api.dev.sodrujestvo.org

stages:
  - build
  - test
  - deploy

.docker_login: &docker_login
  - docker info
  - echo ${YC_KEY} | docker login --username json_key --password-stdin cr.yandex

build:
  <<: *docker_job
  stage: build
  before_script: *docker_login
  script:
    # Слои прошлой сборки экономят на bundle install: без кэша каждая сборка заново
    # компилирует нативные расширения (pg, sqlite3, bootsnap).
    - docker pull ${IMAGE}:latest || true
    - >-
      docker build
      --cache-from ${IMAGE}:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag ${IMAGE}:${CI_COMMIT_SHORT_SHA}
      --tag ${IMAGE}:latest .
    - docker push ${IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE}:latest

# Тот же Dockerfile, но с dev/test-гемами: отдельного окружения для прогона не требуется.
.test_image: &test_image
  - *docker_login
  - docker pull ${IMAGE}:latest || true
  - >-
    docker build --target build
    --build-arg BUNDLE_WITHOUT=""
    --cache-from ${IMAGE}:latest
    --tag ${IMAGE}:test-${CI_COMMIT_SHORT_SHA} .

rspec:
  <<: *docker_job
  stage: test
  needs: ["build"]
  before_script: *test_image
  script:
    - docker run --rm -e RAILS_ENV=test ${IMAGE}:test-${CI_COMMIT_SHORT_SHA} bundle exec rspec

rubocop:
  <<: *docker_job
  stage: test
  needs: ["build"]
  before_script: *test_image
  script:
    - docker run --rm ${IMAGE}:test-${CI_COMMIT_SHORT_SHA} bundle exec rubocop

deploy:
  stage: deploy
  image: sanbusrt/helm-deployer:kubedog-custom1
  needs: ["build", "rspec", "rubocop"]
  resource_group: chat-demo
  environment:
    name: demo
    url: https://chat-demo-api.dev.sodrujestvo.org
  before_script:
    - echo "$YC_KEY" > key.json
    - yc config profile create sa-profile
    - yc config set service-account-key key.json
    - yc config set cloud-id ${YC_CLOUD_ID}
    - yc config set folder-id ${YC_FOLDER_ID}
    - yc managed-kubernetes cluster get-credentials ${KUBE_CLUSTER} --internal
  script:
    # Трассировки здесь быть не должно: set -x печатает команды с подставленными значениями,
    # а ключ сервисного аккаунта — многострочный JSON, и такие переменные GitLab не маскирует.
    # С трассировкой приватный ключ уезжал в лог джобы целиком.
    - set -e
    - test -n "${RAILS_MASTER_KEY}" || (echo "Нет переменной RAILS_MASTER_KEY" && exit 1)
    # Namespace и pull-secret заводим сами: заявка в devops для этого не нужна.
    - kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    # Ключ не идёт ни аргументом команды, ни в лог: собираем dockerconfig во временном файле
    # и отдаём kubectl файлом.
    - |
      umask 077
      printf '{"auths":{"cr.yandex":{"auth":"%s"}}}' "$(printf 'json_key:%s' "$YC_KEY" | base64 | tr -d '\n')" > dockerconfig.json
    - kubectl --namespace "${NAMESPACE}" create secret generic yc-registry
      --type=kubernetes.io/dockerconfigjson
      --from-file=.dockerconfigjson=dockerconfig.json
      --dry-run=client -o yaml | kubectl apply -f -
    - rm -f dockerconfig.json
    - helm upgrade --install "${HELM_RELEASE}" .infra
      --namespace "${NAMESPACE}"
      --set-string image.repository="${IMAGE}"
      --set-string image.tag="${CI_COMMIT_SHORT_SHA}"
      --set-string ingress.host="${CHAT_HOST}"
      --set-string env.CHAT_PUBLIC_URL="https://${CHAT_HOST}"
      --set-string secrets.RAILS_MASTER_KEY="${RAILS_MASTER_KEY}"
      --wait --timeout 5m
    - kubectl -n "${NAMESPACE}" rollout status deploy/${HELM_RELEASE} --timeout=5m
  after_script:
    - rm -f key.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# Перенос переписки с Render. Запускается один раз, вручную, ПОСЛЕ первого удачного деплоя.
#
# Работа идёт изнутри кластера: временный под тянет дамп с Render и заливает его в нашу БД,
# поэтому ни kubectl, ни postgresql-client на машине не нужны. Адрес источника лежит в
# переменной проекта RENDER_DATABASE_URL (External Database URL, masked).
#
# Всё, что было в чате ПОСЛЕ снятия дампа, потеряется: переносить нужно тогда, когда в старом
# чате уже не пишут. Вложения переезжают вместе с дампом — они лежат строками в той же БД.
migrate-from-render:
  stage: deploy
  image: sanbusrt/helm-deployer:kubedog-custom1
  needs: ["deploy"]
  resource_group: chat-demo
  before_script:
    - echo "$YC_KEY" > key.json
    - yc config profile create sa-profile
    - yc config set service-account-key key.json
    - yc config set cloud-id ${YC_CLOUD_ID}
    - yc config set folder-id ${YC_FOLDER_ID}
    - yc managed-kubernetes cluster get-credentials ${KUBE_CLUSTER} --internal
  script:
    - set -e
    - test -n "${RENDER_DATABASE_URL}" || (echo "Нет переменной RENDER_DATABASE_URL" && exit 1)
    - TARGET_URL=$(kubectl -n "${NAMESPACE}" get secret "${HELM_RELEASE}-postgres" -o jsonpath='{.data.url}' | base64 -d)
    # --clean --if-exists: схему в целевой БД уже накатили миграции при старте, и без сноса
    # существующих таблиц восстановление упало бы на первом же конфликте.
    - kubectl -n "${NAMESPACE}" run pg-migrate-${CI_JOB_ID} --rm -i --restart=Never
      --image=postgres:17-alpine
      --env="SRC=${RENDER_DATABASE_URL}"
      --env="DST=${TARGET_URL}"
      --command -- sh -c 'pg_dump --no-owner --no-privileges -Fc "$SRC" | pg_restore --clean --if-exists --no-owner --no-privileges -d "$DST"'
    # Перезапуск не обязателен для данных, но сбрасывает кэши и пул соединений — после
    # подмены содержимого БД это дешевле, чем ловить странности на показе.
    - kubectl -n "${NAMESPACE}" rollout restart deploy/${HELM_RELEASE}
    - kubectl -n "${NAMESPACE}" rollout status deploy/${HELM_RELEASE} --timeout=5m
  after_script:
    - rm -f key.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
